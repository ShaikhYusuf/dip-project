<div class="elite-content-container" *ngIf="content">

  <!-- Audio Control Bar -->
  <div class="audio-controls stagger-item">
    <button mat-icon-button (click)="replaySpeaking()" matTooltip="Replay Explanation" class="audio-btn">
      <mat-icon>replay</mat-icon>
    </button>
    <button mat-icon-button (click)="stopSpeaking()" matTooltip="Stop Speaking" class="audio-btn stop" *ngIf="isSpeaking">
      <mat-icon>stop_circle</mat-icon>
    </button>
    <span class="audio-status" *ngIf="isSpeaking">
      <span class="pulse-dot"></span>
      Speaking...
    </span>
  </div>

  <!-- Header / Explanation -->
  <div class="explanation-section stagger-item">
    <h2 class="section-title">
      <mat-icon class="title-icon">lightbulb</mat-icon>
      Core Concept
    </h2>
    <div class="explanation-card">
      <p class="explanation-text">{{ content.explanation }}</p>
    </div>
  </div>

  <!-- Examples -->
  <div class="examples-section stagger-item">
    <h2 class="section-title">
      <mat-icon class="title-icon">auto_awesome</mat-icon>
      Examples
    </h2>
    <div class="example-grid">
      @for (each_example of content.examples; track $index) {
      <div class="example-card stagger-item">
        <mat-icon class="bullet-icon">check_circle</mat-icon>
        <span>{{ each_example }}</span>
      </div>
      }
    </div>
  </div>
</div>

<div class="loading-state" *ngIf="!content">
  <div class="skeleton-title"></div>
  <div class="skeleton-text"></div>
  <div class="skeleton-text short"></div>
</div>

<div class="nav-container" *ngIf="content">
  <button class="elite-next-btn btn-premium" (click)="navigateToNextPage()">
    Continue to {{nextPage.replace('/lesson-', '') | titlecase}}
    <mat-icon iconPositionEnd>arrow_forward</mat-icon>
  </button>
</div>
