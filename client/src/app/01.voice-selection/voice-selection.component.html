<div class="container">

  <mat-card class="voice-card">

    <mat-card-header>
      <mat-card-title>Voice Settings</mat-card-title>
      <mat-card-subtitle>Select a voice and test it</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Select Voice</mat-label>
        <mat-select [(ngModel)]="selectedVoice">
          @for (voice of voices; track voice.name) {
            <mat-option [value]="voice">
              {{ voice.name }} {{ voice.default ? '(Default)' : '' }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Quote</mat-label>
        <textarea matInput rows="5" [(ngModel)]="textToRead"></textarea>
      </mat-form-field>

    </mat-card-content>

    <mat-card-actions align="end">

      <button mat-raised-button color="primary" (click)="speak()">
        Read Quote
      </button>

      <button mat-raised-button color="accent" (click)="navigateToLesson()">
        Back
      </button>

    </mat-card-actions>

  </mat-card>

</div>
